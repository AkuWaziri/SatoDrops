name: Deploy SatoTips Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tempo Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
          foundryup -n tempo

      - name: Install forge-std
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          forge install foundry-rs/forge-std --no-commit

      - name: Build contracts
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"
          forge build

      - name: Deploy SatoTips to Tempo mainnet
        env:
          PRIVATE_KEY: ${{ secrets.TEMPO_DEPLOYER_PRIVATE_KEY }}
          FEE_RECIPIENT: ${{ secrets.SATODROPS_FEE_RECIPIENT }}
          VERIFIER_PRIVATE_KEY: ${{ secrets.SATOTIPS_VERIFIER_PRIVATE_KEY }}
          FEE_TOKEN: "0x20c000000000000000000000b9537d11c60e8b50"
        run: |
          export PATH="$HOME/.config/.foundry/bin:$PATH"

          test -n "$PRIVATE_KEY"
          test -n "$FEE_RECIPIENT"
          test -n "$VERIFIER_PRIVATE_KEY"

          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          VERIFIER="$(cast wallet address --private-key "$VERIFIER_PRIVATE_KEY")"

          echo "Deployer: $DEPLOYER"
          echo "Identity verifier: $VERIFIER"

          BALANCE="$(cast call "$FEE_TOKEN" "balanceOf(address)(uint256)" "$DEPLOYER" --rpc-url https://rpc.tempo.xyz)"
          echo "USDC balance (base units): $BALANCE"
          test "$BALANCE" != "0"

          OUTPUT="$(forge create contracts/SatoTips.sol:SatoTips \
            --rpc-url https://rpc.tempo.xyz \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --tempo.fee-token "$FEE_TOKEN" \
            --constructor-args "$FEE_RECIPIENT" "$VERIFIER")"

          echo "$OUTPUT"

          ADDRESS="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Deployed to: //p' | tail -n 1)"
          test -n "$ADDRESS"

          echo "SATOTIPS_CONTRACT_ADDRESS=$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SATOTIPS_CONTRACT_ADDRESS=$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "SATOTIPS_IDENTITY_VERIFIER=$VERIFIER" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment reminder
        run: |
          echo "SatoTips deployment complete."
          echo "Set NEXT_PUBLIC_SATOTIPS_CONTRACT_ADDRESS to the new address in the frontend hosting environment."
          echo "Set SATOTIPS_VERIFIER_PRIVATE_KEY in the server environment to the same verifier key."