name: Deploy SatoDrops Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit

      - name: Build contracts
        run: forge build

      - name: Deploy to Tempo mainnet
        env:
          PRIVATE_KEY: ${{ secrets.TEMPO_DEPLOYER_PRIVATE_KEY }}
          FEE_RECIPIENT: ${{ secrets.SATODROPS_FEE_RECIPIENT }}
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$FEE_RECIPIENT"

          OUTPUT="$(forge create contracts/SatoDrops.sol:SatoDrops             --rpc-url https://rpc.tempo.xyz             --private-key "$PRIVATE_KEY"             --broadcast             --constructor-args "$FEE_RECIPIENT")"

          echo "$OUTPUT"

          ADDRESS="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Deployed to: //p' | tail -n 1)"
          test -n "$ADDRESS"

          echo "SATODROPS_CONTRACT_ADDRESS=$ADDRESS" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SATODROPS_CONTRACT_ADDRESS=$ADDRESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment reminder
        run: |
          echo "Deployment complete."
          echo "Set NEXT_PUBLIC_SATODROPS_CONTRACT_ADDRESS to the deployed address in the frontend hosting environment."
