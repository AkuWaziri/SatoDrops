name: Deploy SatoDrops Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build

      - name: Deploy to Tempo mainnet
        env:
          PRIVATE_KEY: ${{ secrets.TEMPO_DEPLOYER_PRIVATE_KEY }}
          FEE_RECIPIENT: ${{ secrets.SATODROPS_FEE_RECIPIENT }}
          RPC_URL: https://rpc.tempo.xyz
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$FEE_RECIPIENT"
          forge script script/DeploySatoDrops.s.sol:DeploySatoDrops             --rpc-url "$RPC_URL"             --broadcast             -vvvv

      - name: Print next step
        run: |
          echo "Deployment completed. Copy the deployed SatoDrops contract address into NEXT_PUBLIC_SATODROPS_CONTRACT_ADDRESS."
